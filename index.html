<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Balance | 💲CoolBank</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="icons/bank.png">
  <link rel="apple-touch-icon" href="icons/bank.png">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  
  <!-- CSS -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/style.css">
  
  <style>
    .student-page {
      min-height: 100vh;
      padding: var(--space-4);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }
    
    /* Random gradient backgrounds */
    .student-page::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      transition: opacity 1.5s ease;
    }
    
    .student-page.grad1::before {
      background-color: hsla(328,87%,69%,1);
      background-image:
        radial-gradient(at 86% 61%, hsla(270,100%,62%,1) 0px, transparent 50%),
        radial-gradient(at 60% 19%, hsla(346,100%,62%,1) 0px, transparent 50%),
        radial-gradient(at 10% 19%, hsla(14,100%,62%,1) 0px, transparent 50%),
        radial-gradient(at 85% 15%, hsla(41,100%,62%,1) 0px, transparent 50%),
        radial-gradient(at 45% 79%, hsla(29,100%,62%,1) 0px, transparent 50%),
        radial-gradient(at 22% 64%, hsla(166,100%,62%,1) 0px, transparent 50%),
        radial-gradient(at 50% 56%, hsla(328,87%,69%,1) 0px, transparent 50%);
    }
    
    .student-page.grad2::before {
      background-color: hsla(328,87%,69%,1);
      background-image:
        radial-gradient(at 27% 1%, hsla(346,100%,62%,1) 0px, transparent 50%),
        radial-gradient(at 99% 86%, hsla(14,100%,62%,1) 0px, transparent 50%),
        radial-gradient(at 65% 23%, hsla(270,100%,62%,1) 0px, transparent 50%),
        radial-gradient(at 36% 32%, hsla(41,100%,62%,1) 0px, transparent 50%),
        radial-gradient(at 89% 58%, hsla(18,100%,62%,1) 0px, transparent 50%),
        radial-gradient(at 19% 37%, hsla(29,100%,62%,1) 0px, transparent 50%),
        radial-gradient(at 14% 93%, hsla(166,100%,62%,1) 0px, transparent 50%),
        radial-gradient(at 19% 77%, hsla(328,87%,69%,1) 0px, transparent 50%);
    }
    
    .student-page.grad3::before {
      background-color: hsla(328,87%,69%,1);
      background-image:
        radial-gradient(at 92% 44%, hsla(14,100%,62%,1) 0px, transparent 50%),
        radial-gradient(at 78% 75%, hsla(328,87%,69%,1) 0px, transparent 50%),
        radial-gradient(at 27% 42%, hsla(41,100%,62%,1) 0px, transparent 50%),
        radial-gradient(at 72% 17%, hsla(270,100%,62%,1) 0px, transparent 50%),
        radial-gradient(at 24% 7%, hsla(166,100%,62%,1) 0px, transparent 50%),
        radial-gradient(at 94% 5%, hsla(29,100%,62%,1) 0px, transparent 50%),
        radial-gradient(at 52% 71%, hsla(346,100%,62%,1) 0px, transparent 50%);
    }

    .student-header {
      text-align: center;
      color: white;
      margin-bottom: var(--space-6);
      animation: slideInDown 0.5s ease;
    }

    .student-header .logo { 
      width: 72px;
      height: 72px;
      margin-bottom: var(--space-2); 
      animation: gentleFloat 3s ease-in-out infinite;
      display: inline-block;
      object-fit: contain;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,0.2));
    }
    
    @keyframes gentleFloat {
      0%, 100% { 
        transform: translateY(0px); 
      }
      50% { 
        transform: translateY(-10px); 
      }
    }
    
    .student-header h1 { font-family: var(--font-display); font-size: var(--text-2xl); font-weight: var(--font-extrabold); text-shadow: 0 2px 10px rgba(0,0,0,0.2); }
    .student-header .school-name { font-size: var(--text-sm); opacity: 0.9; margin-top: var(--space-1); }

    .student-main-card {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border-radius: var(--radius-2xl);
      box-shadow: var(--shadow-xl);
      overflow: hidden;
      animation: slideInUp 0.6s ease;
    }

    .balance-section {
      background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
      padding: var(--space-8) var(--space-6);
      text-align: center;
      color: white;
      box-shadow: var(--shadow-lg);
    }

    .student-name { font-size: var(--text-xl); font-weight: var(--font-bold); margin-bottom: var(--space-2); }
    .student-class { font-size: var(--text-sm); opacity: 0.8; margin-bottom: var(--space-4); }
    .balance-label { font-size: var(--text-sm); text-transform: uppercase; letter-spacing: 1px; opacity: 0.8; margin-bottom: var(--space-2); }
    .balance-amount { font-family: var(--font-display); font-size: 4rem; font-weight: var(--font-extrabold); line-height: 1; }
    .balance-amount.negative { color: #FF6B6B; }

    .subject-balances {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: var(--space-2);
      margin-top: var(--space-4);
      padding-top: var(--space-4);
      border-top: 1px solid rgba(255,255,255,0.2);
    }
    
    .subject-badge {
      display: flex;
      align-items: center;
      gap: var(--space-1);
      background: rgba(255,255,255,0.15);
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-full);
      font-size: var(--text-sm);
    }

    .student-tabs { display: flex; border-bottom: 1px solid var(--border); }
    .student-tab {
      flex: 1;
      padding: var(--space-4);
      font-size: var(--text-sm);
      font-weight: var(--font-semibold);
      color: var(--text-muted);
      background: none;
      border: none;
      cursor: pointer;
      position: relative;
    }
    .student-tab::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--primary);
      transform: scaleX(0);
      transition: transform var(--transition-fast);
    }
    .student-tab.active { color: var(--primary); }
    .student-tab.active::after { transform: scaleX(1); }

    .tab-content { display: none; padding: var(--space-4); max-height: 400px; overflow-y: auto; }
    .tab-content.active { display: block; animation: fadeIn 0.3s ease; }

    #transactionsTab {
      background: var(--surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      margin: var(--space-4);
    }

    .transaction-item {
      display: flex;
      align-items: flex-start;
      gap: var(--space-3);
      padding: var(--space-3);
      border-radius: var(--radius-lg);
      background: var(--background-alt);
      margin-bottom: var(--space-2);
    }

    .transaction-item.reward-earned {
      background: linear-gradient(135deg, #ffe6c7 0%, #ffd9e9 50%, #efe1ff 100%);
    }
    .transaction-icon { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; background: var(--surface); border-radius: var(--radius-md); flex-shrink: 0; }
    .transaction-info { flex: 1; min-width: 0; }
    .transaction-reason { font-weight: var(--font-medium); font-size: var(--text-sm); margin-bottom: 4px; }
    .transaction-meta { font-size: var(--text-xs); color: var(--text-muted); margin-top: 2px; line-height: 1.4; }
    .transaction-amount { font-size: var(--text-lg); font-weight: var(--font-bold); color: var(--success); }
    .transaction-amount.negative { color: var(--danger); }

    .transactions-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      margin-bottom: var(--space-3);
    }

    .transactions-title {
      font-size: var(--text-sm);
      font-weight: var(--font-semibold);
      color: var(--text-secondary);
    }

    .info-button {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--transition-fast);
      font-size: 0.95rem;
    }

    .info-button:hover {
      background: var(--background-alt);
      color: var(--primary);
      border-color: var(--primary);
    }

    .quick-rewards-catalog {
      display: grid;
      gap: var(--space-3);
    }

    .quick-reward-catalog-item {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-3);
      border-radius: var(--radius-lg);
      background: #f2eaff;
    }

    .quick-reward-catalog-icon {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      flex-shrink: 0;
    }

    .quick-reward-catalog-info {
      flex: 1;
      min-width: 0;
    }

    .quick-reward-catalog-name {
      font-weight: var(--font-semibold);
      margin-bottom: 2px;
    }

    .quick-reward-catalog-desc {
      font-size: var(--text-xs);
      color: var(--text-muted);
    }

    .quick-reward-catalog-amount {
      font-weight: var(--font-bold);
      font-size: var(--text-base);
      color: var(--success);
    }

    .quick-reward-catalog-amount.negative {
      color: var(--danger);
    }

    .reward-item {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-4);
      border-radius: var(--radius-lg);
      background: var(--background-alt);
      margin-bottom: var(--space-3);
      border: 2px solid transparent;
    }
    .reward-item.affordable { border-color: var(--success-light); background: rgba(46, 204, 113, 0.05); }
    .reward-icon { width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; font-size: 1.75rem; background: var(--surface); border-radius: var(--radius-lg); }
    .reward-info { flex: 1; }
    .reward-name { font-weight: var(--font-semibold); }
    .reward-description { font-size: var(--text-sm); color: var(--text-muted); margin-top: 2px; }
    .reward-cost { font-size: var(--text-lg); font-weight: var(--font-bold); color: var(--accent); align-self: center; padding: 6px 10px; border-radius: var(--radius-md); }
    .reward-item.affordable .reward-cost { color: var(--success); background: #fff; }
    .reward-item.unavailable {
      background: #f3f3f3;
      border-color: #e0e0e0;
      opacity: 0.6;
      filter: grayscale(0.4);
    }
    .reward-item.unavailable .reward-cost {
      color: var(--text-muted);
    }
    .reward-item.unavailable .reward-description {
      color: var(--text-muted);
    }
    .reward-item.unavailable .request-btn {
      background: #cfcfcf;
      cursor: not-allowed;
    }
    .request-btn { margin-top: var(--space-2); padding: var(--space-2) var(--space-4); font-size: var(--text-sm); background: var(--primary); color: white; border: none; border-radius: var(--radius-md); cursor: pointer; }
    .request-btn:hover { background: var(--primary-dark); }

    .leaderboard-item { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3); border-radius: var(--radius-lg); background: var(--background-alt); margin-bottom: var(--space-2); }
    .leaderboard-item.current-user { background: rgba(var(--primary-rgb), 0.1); border: 2px solid var(--primary); }
    .leaderboard-rank { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-weight: var(--font-bold); background: var(--surface); border-radius: var(--radius-full); }
    .leaderboard-item:nth-child(1) .leaderboard-rank { background: gold; }
    .leaderboard-item:nth-child(2) .leaderboard-rank { background: silver; }
    .leaderboard-item:nth-child(3) .leaderboard-rank { background: #CD7F32; color: white; }
    .leaderboard-name { flex: 1; font-weight: var(--font-medium); }
    .leaderboard-balance { font-weight: var(--font-bold); color: var(--primary); }

    .motivation-quote {
      margin-top: var(--space-6);
      padding: var(--space-4);
      background: rgba(255,255,255,0.15);
      border-radius: var(--radius-xl);
      text-align: center;
      color: white;
      font-style: italic;
      backdrop-filter: blur(10px);
      max-width: 420px;
    }

    .student-error, .student-loading { width: 100%; max-width: 420px; padding: var(--space-8); background: var(--surface); border-radius: var(--radius-2xl); text-align: center; box-shadow: var(--shadow-xl); }
    .student-error-icon, .student-loading-icon { font-size: 4rem; margin-bottom: var(--space-4); }
    .student-error h2 { color: var(--danger); margin-bottom: var(--space-2); }

    @media (max-width: 480px) {
      .student-page { padding: var(--space-3); }
      .balance-amount { font-size: 3rem; }
    }

    /* ===== Più docenti: schede scorrevoli ===== */
    .student-deck-wrap { width: 100%; max-width: 420px; }
    .pending-note { font-size: var(--text-sm); color: var(--text-muted); margin-top: 4px; }
    .teacher-chip { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.2); border-radius: 999px; padding: 4px 12px; font-size: var(--text-sm); font-weight: 600; margin-bottom: var(--space-3); }
    .student-tab::after { background: var(--tab-col, var(--primary)); }
    .student-tab.active { color: var(--tab-col, var(--primary)); }

    .subject-nav { width: 100%; display: flex; gap: 6px; margin-bottom: var(--space-3); overflow-x: auto; scrollbar-width: none; }
    .subject-nav::-webkit-scrollbar { display: none; }
    .subject-pill { flex: 1 0 auto; border: 0; cursor: pointer; padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,.22); color: #fff; font-weight: 600; font-size: var(--text-sm); backdrop-filter: blur(8px); transition: all .2s; white-space: nowrap; }
    .subject-pill.active { background: #fff; color: var(--text-primary); box-shadow: var(--shadow-md); }

    .deck { width: 100%; position: relative; }
    .deck-track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; gap: 12px; scrollbar-width: none; align-items: flex-start; padding-bottom: 32px; margin-bottom: -32px; }
    .deck-track::-webkit-scrollbar { display: none; }
    .deck.single .deck-track { overflow: visible; padding-bottom: 0; margin-bottom: 0; }
    .deck-slide { flex: 0 0 100%; scroll-snap-align: center; min-width: 0; }
    .deck .student-main-card { max-width: none; }
    .deck.single .deck-arrow { display: none; }
    .deck-hint { color: #fff; text-align: center; font-size: var(--text-xs); margin-top: var(--space-3); opacity: .9; }
    .deck-dots { display: flex; justify-content: center; gap: 8px; margin-top: var(--space-4); }
    .deck-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.45); transition: all .2s; }
    .deck-dot.active { background: #fff; width: 22px; border-radius: 99px; }
    .deck-arrow { position: absolute; top: 90px; z-index: 5; width: 36px; height: 36px; border-radius: 50%; border: 0; background: rgba(255,255,255,.9); box-shadow: var(--shadow-md); cursor: pointer; font-size: 18px; }
    .deck-arrow.prev { left: -18px; } .deck-arrow.next { right: -18px; }
    .deck-arrow[disabled] { opacity: 0; pointer-events: none; }
    @media (max-width: 520px) { .deck-arrow { display: none; } }
  </style>
</head>
<body>
  <div class="student-page">
    <header class="student-header">
      <img class="logo" src="icons/bank.png" alt="Bank logo">
      <h1>💲Cool Bank</h1>
      <p id="schoolNameHeader" class="school-name">Loading...</p>
    </header>

    <div id="loadingState" class="student-loading">
      <div class="student-loading-icon"><div class="spinner spinner-lg"></div></div>
      <p>Loading student data...</p>
    </div>

    <div id="errorState" class="student-error hidden">
      <div class="student-error-icon">😕</div>
      <h2>Student not found</h2>
      <p id="errorMessage" class="text-muted">Check the link or contact your teacher.</p>
    </div>

    <div id="mainContent" class="student-deck-wrap hidden">
      <!-- Compare solo se l'alunno ha più di un docente -->
      <nav id="subjectNav" class="subject-nav hidden"></nav>

      <div id="deck" class="deck single">
        <button id="prevBtn" class="deck-arrow prev" aria-label="Previous">‹</button>
        <button id="nextBtn" class="deck-arrow next" aria-label="Next">›</button>
        <div id="track" class="deck-track"></div>
        <div id="dots" class="deck-dots hidden"></div>
        <p id="hint" class="deck-hint hidden"></p>
      </div>
    </div>

    <div id="motivationQuote" class="motivation-quote hidden"></div>
  </div>

  <!-- Quick Rewards Info Modal -->
  <div id="quickRewardsInfoBackdrop" class="modal-backdrop" onclick="closeQuickRewardsInfo()"></div>
  <div id="quickRewardsInfoModal" class="modal">
    <div class="modal-header">
      <h3 id="qrTitle" class="modal-title">⚡ Quick rewards catalog</h3>
      <button class="modal-close" onclick="closeQuickRewardsInfo()">×</button>
    </div>
    <div class="modal-body">
      <p id="qrIntro" class="text-muted" style="margin-bottom: var(--space-4);">These are the quick rewards a teacher can give you instantly.</p>
      <div id="quickRewardsCatalogList" class="quick-rewards-catalog"></div>
    </div>
    <div class="modal-footer">
      <button id="qrClose" class="btn btn-secondary" onclick="closeQuickRewardsInfo()">Close</button>
    </div>
  </div>

  <!-- Teacher Selection Modal -->
  <div id="teacherModal" class="teacher-selection-modal" style="display: none;" onclick="closeTeacherModal()">
    <div class="card" style="max-width: 500px; margin: auto; margin-top: 100px;" onclick="event.stopPropagation()">
      <div class="card-header">
        <h3 id="reqTitle" style="margin: 0;">👨‍🏫 Ask the teacher.</h3>
      </div>
      <div class="card-body">
        <div style="margin-top: var(--space-4);">
          <label id="reqMsgLabel" for="requestMessage" style="display: block; font-weight: var(--font-semibold); margin-bottom: var(--space-2); color: var(--text);">💬 Message (optional)</label>
          <textarea
            id="requestMessage"
            placeholder="Example: I would like to listen to 'Imagine' by John Lennon..."
            style="width: 100%; min-height: 80px; padding: var(--space-3); border: 1px solid var(--border); border-radius: var(--radius-md); font-size: var(--text-sm); font-family: inherit; resize: vertical;"
          ></textarea>
        </div>

        <div style="margin-top: var(--space-4); display: flex; gap: var(--space-3); justify-content: flex-end;">
          <button id="reqCancel" onclick="closeTeacherModal()" style="padding: var(--space-3) var(--space-5); border: 1px solid var(--border); background: white; color: var(--text); border-radius: var(--radius-md); cursor: pointer; font-weight: var(--font-semibold);">
            ❌ Cancel
          </button>
          <button id="sendRequestBtn" onclick="sendSelectedRequest()" style="padding: var(--space-3) var(--space-5); border: none; background: var(--primary); color: white; border-radius: var(--radius-md); cursor: pointer; font-weight: var(--font-semibold);" disabled>
            📤 Send request
          </button>
        </div>
      </div>
    </div>
  </div>

  <style>
    .teacher-selection-modal {
      position: fixed !important;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.7);
      align-items: center;
      justify-content: center;
      z-index: 9999 !important;
      padding: 20px;
    }
    .teacher-selection-modal .card {
      background: white;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      z-index: 10000;
      position: relative;
    }
  </style>

  <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script defer src="js/firebase-config.js"></script>
  <script defer src="js/script.js"></script>
  <script defer src="js/ledger.js"></script>

  <script type="module">
    /* =============================================
       Pagina alunno
       - Un solo docente (o nessun conto configurato): identica a prima.
       - Più docenti: una scheda per docente, da scorrere. Ogni scheda ha
         saldo, transazioni e premi del SUO docente, nella sua lingua,
         con il suo colore e la sua valuta.
       ============================================= */

    const MOTIVATION = {
      en: ["💡 Spend your money well!", "✅ Good choices help you.", "🌟 Time spent learning is always good!", "🚀 Today’s effort builds your tomorrow.", "🎯 Clear goals bring great results!", "💪 Steady work beats talent.", "📚 Knowledge is the real treasure."],
      it: ["💡 Spendi bene i tuoi soldi!", "✅ Le scelte giuste ti aiutano.", "🌟 Il tempo passato a imparare è sempre ben speso!", "🚀 L'impegno di oggi costruisce il tuo domani.", "🎯 Obiettivi chiari, grandi risultati!", "💪 La costanza batte il talento.", "📚 La conoscenza è il vero tesoro."]
    };

    // Testi dell'interfaccia: ogni scheda parla la lingua del suo docente
    const STR = {
      en: {
        balance: 'Your balance', cls: 'Class', tx: '📜 Transactions', rw: '🎁 Rewards', recent: 'Recent transactions',
        noTx: 'No transactions', noRw: 'No rewards available', from: 'From', noReason: 'No reason', teacher: 'Teacher',
        req: 'Request', notEnough: 'Not enough', pending: (p, a) => `⏳ ${p} pending approval • ${a} available`,
        hint: '👆 Swipe to see your other teachers', qrTitle: '⚡ Quick rewards catalog', qrIntro: 'These are the quick rewards a teacher can give you instantly.',
        qrNone: 'No quick rewards available.', qrNoDesc: 'No description', qrFail: 'Unable to load quick rewards.', close: 'Close',
        askTitle: '👨‍🏫 Ask the teacher.', msgLabel: '💬 Message (optional)', cancel: '❌ Cancel', send: '📤 Send request',
        placeholder: 'Explain your request (when, how, where, with whom, etc.).',
        archived: d => `🎓 This class has graduated — this page is a memory snapshot${d ? ' from ' + d : ''}. Nothing changes from here.`,
        archivedBlock: '🎓 This class has graduated — this page is a read-only memory snapshot, so new requests aren\'t possible.',
        noTeacher: '❌ No teacher available', sent: n => `✅ Request sent to ${n}!`,
        notEnoughAlert: (p, a) => `❌ Not enough available balance. You have ${p} tied up in pending requests, leaving ${a} available.`,
        rejected: (r, why, who) => `❌ Your request "${r}"${who} was rejected${why ? `\n\n👨‍🏫 Teacher message: ${why}` : ''}`,
        approved: (r, who) => `✅ Your request "${r}"${who} was approved!`,
        justNow: 'just now', mAgo: n => `${n}m ago`, hAgo: n => `${n}h ago`, dAgo: n => `${n}d ago`, locale: 'en-GB',
        noPerm: '❌ Permission denied: update your Firestore rules to allow anonymous writes to rewardRequests.\n\nSee firestore.rules in the project.',
        noAnon: '❌ Anonymous login is not enabled in Firebase Console.\nGo to Authentication → Sign-in methods → Anonymous → Enable.',
        sendErr: 'Sending error'
      },
      it: {
        balance: 'Il tuo saldo', cls: 'Classe', tx: '📜 Transazioni', rw: '🎁 Premi', recent: 'Ultime transazioni',
        noTx: 'Nessuna transazione', noRw: 'Nessun premio disponibile', from: 'Da', noReason: 'Nessun motivo', teacher: 'Docente',
        req: 'Richiedi', notEnough: 'Non basta', pending: (p, a) => `⏳ ${p} in attesa di approvazione • ${a} disponibili`,
        hint: '👆 Scorri per vedere gli altri prof', qrTitle: '⚡ Catalogo premi rapidi', qrIntro: 'Questi sono i premi rapidi che il docente può darti al volo.',
        qrNone: 'Nessun premio rapido disponibile.', qrNoDesc: 'Nessuna descrizione', qrFail: 'Impossibile caricare i premi rapidi.', close: 'Chiudi',
        askTitle: '👨‍🏫 Chiedi al docente.', msgLabel: '💬 Messaggio (facoltativo)', cancel: '❌ Annulla', send: '📤 Invia richiesta',
        placeholder: 'Spiega la tua richiesta (quando, come, dove, con chi, ecc.).',
        archived: d => `🎓 Questa classe ha finito il percorso — questa pagina è un ricordo${d ? ' del ' + d : ''}. Da qui non cambia più nulla.`,
        archivedBlock: '🎓 Questa classe ha finito il percorso — la pagina è solo un ricordo in sola lettura, quindi non si possono fare nuove richieste.',
        noTeacher: '❌ Nessun docente disponibile', sent: n => `✅ Richiesta inviata a ${n}!`,
        notEnoughAlert: (p, a) => `❌ Saldo disponibile insufficiente. Hai ${p} bloccati in richieste in attesa, ne restano ${a} disponibili.`,
        rejected: (r, why, who) => `❌ La tua richiesta "${r}"${who} è stata rifiutata${why ? `\n\n👨‍🏫 Messaggio del docente: ${why}` : ''}`,
        approved: (r, who) => `✅ La tua richiesta "${r}"${who} è stata approvata!`,
        justNow: 'adesso', mAgo: n => `${n} min fa`, hAgo: n => `${n} h fa`, dAgo: n => `${n} g fa`, locale: 'it-IT',
        noPerm: '❌ Permesso negato: aggiorna le regole di Firestore per consentire la scrittura anonima in rewardRequests.',
        noAnon: '❌ L\'accesso anonimo non è attivo in Firebase Console.',
        sendErr: 'Errore di invio'
      }
    };
    const DEFAULT_COLOR = '#9333EA';   // viola storico del sito: se è questo, la scheda resta identica a prima

    let currentStudent = null;
    let schoolData = null;
    let teachers = [];            // fallback per il conto storico (utenti docenti/admin)
    let viewLedgers = [];         // conti mostrati a questo alunno (1 = pagina come sempre)
    let txAll = [], rewardsAll = [], quickAll = [];
    let currentRequest = null;    // { ledgerId, rewardId }
    let currentSlide = 0;

    const S = ledger => STR[ledger.lang === 'it' ? 'it' : 'en'];
    const L = id => viewLedgers.find(l => l.id === id) || viewLedgers[0];
    const inLedger = (doc, id) => ((doc && doc.ledgerId) || 'main') === id;
    const money = (ledger, n) => Ledger.money(ledger.currency, n);
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const slideEl = id => document.querySelector(`.deck-slide[data-ledger="${CSS.escape(id)}"]`);
    const isDefaultColor = ledger => !ledger.color || ledger.color.toLowerCase() === DEFAULT_COLOR.toLowerCase();

    async function init() {
      // Random gradient on page load
      const gradients = ['grad1', 'grad2', 'grad3'];
      document.querySelector('.student-page').classList.add(gradients[Math.floor(Math.random() * gradients.length)]);

      // Allow Firestore writes via anonymous auth
      try { await firebase.auth().signInAnonymously(); } catch (e) { console.warn('Anonymous auth failed:', e); }

      const params = new URLSearchParams(location.search);
      const studentId = params.get('id');
      const nfcTag = params.get('nfc');
      if (!studentId && !nfcTag) { showError('Missing ID parameter'); return; }

      try {
        if (nfcTag) await findStudentByNFC(nfcTag); else await loadStudentById(studentId);
      } catch (error) {
        console.error('Error:', error);
        showError(error.message || 'Loading error');
      }
    }

    async function findStudentByNFC(nfcTag) {
      const normalizedTag = nfcTag.toUpperCase().trim();
      const schoolsSnap = await db.collection('schools').get();
      for (const schoolDoc of schoolsSnap.docs) {
        const studentsSnap = await db.collection('schools').doc(schoolDoc.id).collection('students')
          .where('nfcTag', '==', normalizedTag).limit(1).get();
        if (!studentsSnap.empty) {
          const studentDoc = studentsSnap.docs[0];
          schoolData = { id: schoolDoc.id, ...schoolDoc.data() };
          currentStudent = { id: studentDoc.id, schoolId: schoolDoc.id, ...studentDoc.data() };
          await loadStudentData();
          return;
        }
      }
      showError('NFC card not recognized');
    }

    async function loadStudentById(studentId) {
      const schoolsSnap = await db.collection('schools').get();
      for (const schoolDoc of schoolsSnap.docs) {
        const studentDoc = await db.collection('schools').doc(schoolDoc.id).collection('students').doc(studentId).get();
        if (studentDoc.exists) {
          schoolData = { id: schoolDoc.id, ...schoolDoc.data() };
          currentStudent = { id: studentId, schoolId: schoolDoc.id, ...studentDoc.data() };
          await loadStudentData();
          return;
        }
      }
      showError('Student not found');
    }

    /* ---------- Quali docenti vede questo alunno ---------- */
    async function loadViewLedgers() {
      const cfg = schoolData.config || {};
      const schoolCurrency = { symbol: cfg.currencySymbol || '$', name: cfg.currencyName || '' };
      let list = [];
      try {
        const snap = await db.collection('schools').doc(currentStudent.schoolId).collection('ledgers').get();
        list = Ledger.ledgersForClass(snap.docs.map(d => ({ id: d.id, ...d.data() })), currentStudent.classId);
      } catch (e) {
        console.warn('Ledgers not available, using the classic single page:', e.code || e.message);
      }
      // Nessun conto configurato per questa classe: pagina di sempre (conto storico)
      if (!list.length) list = [{ id: 'main', lang: 'en', color: DEFAULT_COLOR, name: '', subject: '', currency: schoolCurrency }];
      return list.map(l => ({ ...l, currency: l.currency || schoolCurrency, lang: l.lang === 'it' ? 'it' : 'en' }));
    }

    async function loadStudentData() {
      const sid = currentStudent.schoolId;
      document.getElementById('schoolNameHeader').textContent = schoolData.config?.name || 'Carducci';

      viewLedgers = await loadViewLedgers();
      const multi = viewLedgers.length > 1;
      const first = viewLedgers[0];

      // Lingua dei testi generali = quella del primo docente
      document.documentElement.lang = first.lang;
      applyModalTexts(first);

      // A graduated/archived class is frozen: read-only snapshot, no live listeners, no requests.
      const isArchived = !!currentStudent.archived;

      // Dati di tutti i conti in un colpo solo, poi divisi per conto
      const [txSnap, rwSnap, qrSnap] = await Promise.all([
        db.collection('schools').doc(sid).collection('transactions').where('studentId', '==', currentStudent.id).get(),
        db.collection('schools').doc(sid).collection('rewards').get(),
        db.collection('schools').doc(sid).collection('quickRewards').get()
      ]);
      txAll = txSnap.docs.map(d => ({ id: d.id, ...d.data() }))
        .sort((a, b) => (b.timestamp?.toMillis?.() || 0) - (a.timestamp?.toMillis?.() || 0));
      rewardsAll = rwSnap.docs.map(d => ({ id: d.id, ...d.data() })).filter(r => r.active !== false);
      quickAll = qrSnap.docs.map(d => ({ id: d.id, ...d.data() })).filter(r => r.active !== false);
      if (!isArchived) await loadTeachers();

      buildDeck(multi, isArchived);
      for (const ledger of viewLedgers) {
        renderBalance(ledger);
        renderTransactions(ledger);
        await renderRewards(ledger);
      }

      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('mainContent').classList.remove('hidden');
      showMotivation(first);
      syncDeck();

      if (isArchived) return; // Frozen page: skip live listeners entirely

      // Real-time listener for balance updates (di tutti i conti)
      db.collection('schools').doc(sid).collection('students').doc(currentStudent.id).onSnapshot(doc => {
        if (!doc.exists) return;
        currentStudent = { ...currentStudent, ...doc.data() };
        viewLedgers.forEach(l => { renderBalance(l); renderRewards(l); });
      });

      // Real-time listener for reward request status changes
      db.collection('schools').doc(sid).collection('rewardRequests')
        .where('studentId', '==', currentStudent.id)
        .onSnapshot(snapshot => {
          const refresh = new Set();
          snapshot.docChanges().forEach(change => {
            const request = change.doc.data();
            const ledger = L(request.ledgerId || 'main');
            if (change.type === 'modified') {
              const who = multi && ledger.name ? ` (${ledger.name})` : '';
              if (request.status === 'rejected') {
                alert(S(ledger).rejected(request.rewardName || 'Reward', request.rejectionReason, who));
                refresh.add(ledger.id);
              }
              if (request.status === 'approved') {
                alert(S(ledger).approved(request.rewardName || 'Reward', who));
                refresh.add(ledger.id);
              }
            } else {
              refresh.add(ledger.id); // 'added' or 'removed' change the pending budget
            }
          });
          refresh.forEach(id => renderRewards(L(id)));
        });
    }

    function applyModalTexts(ledger) {
      const s = S(ledger);
      document.getElementById('qrTitle').textContent = s.qrTitle;
      document.getElementById('qrIntro').textContent = s.qrIntro;
      document.getElementById('qrClose').textContent = s.close;
      document.getElementById('reqTitle').textContent = s.askTitle;
      document.getElementById('reqMsgLabel').textContent = s.msgLabel;
      document.getElementById('reqCancel').textContent = s.cancel;
      document.getElementById('sendRequestBtn').textContent = s.send;
    }

    /* ---------- Costruzione delle schede ---------- */
    function slideHTML(ledger, multi, isArchived) {
      const s = S(ledger);
      const styled = !isDefaultColor(ledger);
      const bg = styled ? ` style="background:linear-gradient(135deg, color-mix(in srgb, ${ledger.color} 72%, black) 0%, ${ledger.color} 100%)"` : '';
      const tabCol = styled ? ` style="--tab-col:${ledger.color}"` : '';
      const date = currentStudent.archivedAt ? (currentStudent.archivedAt.toDate ? currentStudent.archivedAt.toDate() : new Date(currentStudent.archivedAt)).toLocaleDateString(s.locale) : '';
      return `
      <section class="deck-slide" data-ledger="${esc(ledger.id)}">
        <div class="student-main-card"${tabCol}>
          ${isArchived ? `<div style="background: linear-gradient(135deg, var(--secondary-light) 0%, var(--accent-light) 100%); color: var(--text-primary); padding: var(--space-3) var(--space-4); border-radius: var(--radius-lg); text-align: center; font-weight: var(--font-semibold); font-size: var(--text-sm); margin-bottom: var(--space-4);">${esc(s.archived(date))}</div>` : ''}
          <div class="balance-section"${bg}>
            ${multi ? `<div class="teacher-chip">${esc(ledger.emoji || '📘')} ${esc(ledger.name)}${ledger.subject ? ' · ' + esc(ledger.subject) : ''}</div>` : ''}
            <h2 class="student-name">${esc(currentStudent.name)}</h2>
            <p class="student-class">${s.cls} ${esc(currentStudent.className || currentStudent.classId || '')}</p>
            <p class="balance-label">${s.balance}</p>
            <div class="balance-amount" data-role="balance">0</div>
            <div class="pending-note hidden" data-role="pending"></div>
          </div>

          <div class="student-tabs">
            <button class="student-tab active" data-tab="transactions">${s.tx}</button>
            <button class="student-tab" data-tab="rewards">${s.rw}</button>
          </div>

          <div class="tab-content active" data-pane="transactions" style="background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-md); margin: var(--space-4);">
            <div class="transactions-header">
              <div class="transactions-title">${s.recent}</div>
              <button class="info-button" data-info="${esc(ledger.id)}" title="${esc(s.qrTitle)}" aria-label="${esc(s.qrTitle)}">ℹ️</button>
            </div>
            <div data-role="txList"></div>
            <div data-role="txEmpty" class="empty-state hidden">
              <div class="empty-state-icon">📭</div>
              <div class="empty-state-title">${s.noTx}</div>
            </div>
          </div>

          <div class="tab-content" data-pane="rewards">
            <div data-role="rwList"></div>
            <div data-role="rwEmpty" class="empty-state hidden">
              <div class="empty-state-icon">🎁</div>
              <div class="empty-state-title">${s.noRw}</div>
            </div>
          </div>
        </div>
      </section>`;
    }

    function buildDeck(multi, isArchived) {
      const track = document.getElementById('track');
      track.innerHTML = viewLedgers.map(l => slideHTML(l, multi, isArchived)).join('');
      document.getElementById('deck').classList.toggle('single', !multi);
      document.getElementById('subjectNav').classList.toggle('hidden', !multi);
      document.getElementById('dots').classList.toggle('hidden', !multi);
      const hint = document.getElementById('hint');
      hint.classList.toggle('hidden', !multi);
      hint.textContent = S(viewLedgers[0]).hint;
      document.getElementById('subjectNav').innerHTML = viewLedgers.map((l, i) =>
        `<button class="subject-pill" data-i="${i}">${esc(l.emoji || '📘')} ${esc(l.subject || l.name)}</button>`).join('');
      document.getElementById('dots').innerHTML = viewLedgers.map(() => '<span class="deck-dot"></span>').join('');
      document.getElementById('subjectNav').onclick = e => { const b = e.target.closest('.subject-pill'); if (b) goTo(+b.dataset.i); };
    }

    /* ---------- Rendering per conto ---------- */
    function renderBalance(ledger) {
      const el = slideEl(ledger.id)?.querySelector('[data-role="balance"]');
      if (!el) return;
      const balance = Ledger.balanceOf(currentStudent, ledger.id);
      el.textContent = money(ledger, balance);
      el.classList.toggle('negative', balance < 0);
    }

    function renderTransactions(ledger) {
      const slide = slideEl(ledger.id);
      if (!slide) return;
      const s = S(ledger);
      const list = slide.querySelector('[data-role="txList"]');
      const empty = slide.querySelector('[data-role="txEmpty"]');
      const txs = txAll.filter(t => inLedger(t, ledger.id)).slice(0, 30);
      if (!txs.length) { empty.classList.remove('hidden'); list.innerHTML = ''; return; }
      empty.classList.add('hidden');
      list.innerHTML = txs.map(tx => `
        <div class="transaction-item ${tx.amount >= 0 ? 'reward-earned' : ''}">
          <div class="transaction-icon">${tx.icon || '⭐'}</div>
          <div class="transaction-info">
            <div class="transaction-amount ${tx.amount < 0 ? 'negative' : ''}">${tx.amount >= 0 ? '+' : ''}${money(ledger, Math.abs(tx.amount))}</div>
            <div class="transaction-reason">${tx.reason || s.noReason}</div>
            <div class="transaction-meta">${s.from} ${tx.teacherName || ledger.name || s.teacher} • ${tx.timestamp ? formatTime(tx.timestamp, s) : ''}</div>
          </div>
        </div>`).join('');
    }

    // Costo delle richieste ancora in attesa, per conto
    async function getPendingTotal(ledger) {
      try {
        const snapshot = await db.collection('schools').doc(currentStudent.schoolId).collection('rewardRequests')
          .where('studentId', '==', currentStudent.id).where('status', '==', 'pending').get();
        return snapshot.docs.reduce((sum, d) => {
          const data = d.data();
          if (!inLedger(data, ledger.id)) return sum;
          if (typeof data.cost === 'number') return sum + data.cost;
          const reward = rewardsAll.find(r => r.id === data.rewardId);   // richieste vecchie senza costo
          return sum + (reward ? (reward.cost || 0) : 0);
        }, 0);
      } catch (error) {
        console.error('Pending requests total error:', error);
        return 0;
      }
    }

    async function renderRewards(ledger) {
      const slide = slideEl(ledger.id);
      if (!slide) return;
      const s = S(ledger);
      const list = slide.querySelector('[data-role="rwList"]');
      const empty = slide.querySelector('[data-role="rwEmpty"]');
      const pendingNote = slide.querySelector('[data-role="pending"]');
      const balance = Ledger.balanceOf(currentStudent, ledger.id);
      const isArchived = !!currentStudent.archived;
      const styled = !isDefaultColor(ledger);

      let available = balance;
      if (isArchived) {
        pendingNote.classList.add('hidden');
      } else {
        const pendingTotal = await getPendingTotal(ledger);
        ledger._pending = pendingTotal;
        available = balance - pendingTotal;
        if (pendingTotal > 0) {
          pendingNote.textContent = s.pending(money(ledger, pendingTotal), money(ledger, available));
          pendingNote.classList.remove('hidden');
        } else {
          pendingNote.classList.add('hidden');
        }
      }

      const all = rewardsAll.filter(r => inLedger(r, ledger.id));
      if (!all.length) { empty.classList.remove('hidden'); list.innerHTML = ''; return; }
      empty.classList.add('hidden');

      if (isArchived) {
        // Read-only souvenir view: just what the rewards catalog looked like.
        list.innerHTML = all.map(r => `
          <div class="reward-item">
            <div class="reward-icon">${r.icon || '🎁'}</div>
            <div class="reward-info"><div class="reward-name">${r.name}</div><div class="reward-description">${r.description || ''}</div></div>
            <div class="reward-cost">${money(ledger, r.cost)}</div>
          </div>`).join('');
        return;
      }

      const byCost = (a, b) => (a.cost || 0) - (b.cost || 0);
      const sorted = [...all.filter(r => available >= r.cost).sort(byCost), ...all.filter(r => available < r.cost).sort(byCost)];
      list.innerHTML = sorted.map(r => {
        const ok = available >= r.cost;
        return `
          <div class="reward-item ${ok ? 'affordable' : 'unavailable'}" ${ok ? '' : `data-info="${esc(ledger.id)}"`}>
            <div class="reward-icon">${r.icon || '🎁'}</div>
            <div class="reward-info">
              <div class="reward-name">${r.name}</div>
              <div class="reward-description">${r.description || ''}</div>
              <button class="request-btn ${ok ? '' : 'not-enough-btn'}" ${ok && styled ? `style="background:${ledger.color}"` : ''} data-ledger="${esc(ledger.id)}" data-reward-id="${r.id}" data-reward-name="${esc(r.name)}" data-available="${ok}" ${ok ? '' : 'aria-disabled="true"'}>
                ${ok ? s.req : s.notEnough}
              </button>
            </div>
            <div class="reward-cost">${money(ledger, r.cost)}</div>
          </div>`;
      }).join('');
    }

    // Un solo ascoltatore per tutte le schede (richieste, tab, info)
    document.addEventListener('click', e => {
      const tab = e.target.closest('.student-tab');
      if (tab) {
        const card = tab.closest('.student-main-card');
        card.querySelectorAll('.student-tab').forEach(t => t.classList.toggle('active', t === tab));
        card.querySelectorAll('.tab-content').forEach(p => p.classList.toggle('active', p.dataset.pane === tab.dataset.tab));
        return;
      }
      const btn = e.target.closest('.request-btn');
      if (btn) {
        e.stopPropagation();
        if (btn.dataset.available === 'true') requestReward(btn.dataset.ledger, btn.dataset.rewardId, btn.dataset.rewardName);
        else openQuickRewardsInfo(btn.dataset.ledger);
        return;
      }
      const info = e.target.closest('[data-info]');
      if (info) openQuickRewardsInfo(info.dataset.info);
    });

    /* ---------- Premi rapidi (catalogo) ---------- */
    async function openQuickRewardsInfo(ledgerId) {
      const ledger = L(ledgerId);
      const s = S(ledger);
      applyModalTexts(ledger);
      document.getElementById('quickRewardsInfoBackdrop').classList.add('active');
      document.getElementById('quickRewardsInfoModal').classList.add('active');
      const list = document.getElementById('quickRewardsCatalogList');
      const rewards = quickAll.filter(r => inLedger(r, ledger.id)).sort((a, b) => (a.amount || 0) - (b.amount || 0));
      if (!rewards.length) { list.innerHTML = `<div class="text-muted">${s.qrNone}</div>`; return; }
      list.innerHTML = rewards.map(r => {
        const amount = r.amount || 0;
        return `
          <div class="quick-reward-catalog-item">
            <div class="quick-reward-catalog-icon">${r.icon || '⭐'}</div>
            <div class="quick-reward-catalog-info">
              <div class="quick-reward-catalog-name">${r.name || 'Quick reward'}</div>
              <div class="quick-reward-catalog-desc">${r.description || s.qrNoDesc}</div>
            </div>
            <div class="quick-reward-catalog-amount ${amount < 0 ? 'negative' : ''}">${amount >= 0 ? '+' : ''}${money(ledger, Math.abs(amount))}</div>
          </div>`;
      }).join('');
    }
    function closeQuickRewardsInfo() {
      document.getElementById('quickRewardsInfoBackdrop').classList.remove('active');
      document.getElementById('quickRewardsInfoModal').classList.remove('active');
    }

    /* ---------- Richieste di premi ---------- */
    async function loadTeachers() {
      try {
        const snapshot = await db.collection('users')
          .where('schoolId', '==', currentStudent.schoolId)
          .where('role', 'in', ['teacher', 'admin']).get();
        // Per il conto storico: chi è admin viene per primo (è il suo conto)
        teachers = snapshot.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.role === 'admin' ? 0 : 1) - (b.role === 'admin' ? 0 : 1));
      } catch (error) {
        console.error('Teachers load error:', error.code, error.message, error);
      }
    }

    // A chi va la richiesta di un conto: il proprietario del conto, oppure (conto storico) il primo admin
    function teacherForLedger(ledger) {
      if (ledger.ownerUid) return { id: ledger.ownerUid, name: ledger.name || (teachers.find(t => t.id === ledger.ownerUid)?.name) || '' };
      const t = teachers[0];
      return t ? { id: t.id, name: ledger.name || t.name } : null;
    }

    async function requestReward(ledgerId, rewardId, rewardName) {
      const ledger = L(ledgerId);
      const s = S(ledger);
      if (currentStudent.archived) { alert(s.archivedBlock); return; }
      if (!teacherForLedger(ledger)) { alert(s.noTeacher); return; }

      // Re-check the available budget right before opening the modal
      const reward = rewardsAll.find(r => r.id === rewardId);
      const pending = await getPendingTotal(ledger);
      const available = Ledger.balanceOf(currentStudent, ledger.id) - pending;
      if (reward && available < reward.cost) {
        alert(s.notEnoughAlert(money(ledger, pending), money(ledger, available)));
        renderRewards(ledger);
        return;
      }

      currentRequest = { ledgerId, rewardId };
      applyModalTexts(ledger);
      document.getElementById('requestMessage').placeholder = getPlaceholderForReward(rewardName, ledger);
      document.getElementById('sendRequestBtn').disabled = false;
      document.getElementById('teacherModal').style.display = 'flex';
    }

    function getPlaceholderForReward(rewardName, ledger) {
      const placeholders = {
        '1 week no homework': 'Example: I have a tournament next week and need time ...',
        'Deskmate for 1 week': 'Example: I would like to sit next to Eurydice next week.',
        'Deskmate for 1h': 'Example: I would like to sit next to Persephone for the next hour.',
        'Choose a song': 'Example: I would like to listen to "Aglio e Olio" by Fulminacci.',
        'Choose a song in English': 'Example: I would like to listen to "Ophelia" by The Lumineers.',
        'Group work': 'Example: I would like to be in a group with Achilles, Patroclus, and Chiron.',
        'Shoutout to a friend': 'Example: I want to thank Daedalus for helping me with math.',
        'Remove worst grade': 'Example: Please remove my worst grade from the test on 15/01.',
        'No homework': 'Example: I have training tonight and would like to skip today’s homework.',
        '+1 to grade': 'Example: Please add +1 to my test grade from last week.'
      };
      if (ledger.lang !== 'it' && placeholders[rewardName]) return placeholders[rewardName];
      return S(ledger).placeholder;
    }

    function closeTeacherModal() {
      document.getElementById('teacherModal').style.display = 'none';
      currentRequest = null;
      document.getElementById('requestMessage').value = '';
      document.getElementById('sendRequestBtn').disabled = true;
    }

    async function sendSelectedRequest() {
      if (!currentRequest) return;
      const ledger = L(currentRequest.ledgerId);
      const s = S(ledger);
      const target = teacherForLedger(ledger);
      if (!target) { alert(s.noTeacher); return; }
      if (currentStudent.archived) { alert(s.archivedBlock); closeTeacherModal(); return; }

      try {
        if (!firebase.auth().currentUser) await firebase.auth().signInAnonymously();
        const message = document.getElementById('requestMessage').value.trim();

        const rewardDoc = await db.collection('schools').doc(currentStudent.schoolId).collection('rewards').doc(currentRequest.rewardId).get();
        const rewardData = rewardDoc.exists ? rewardDoc.data() : null;
        const rewardName = rewardData ? rewardData.name : 'Reward';
        const rewardCost = rewardData ? (rewardData.cost || 0) : 0;

        // Final safety check right before writing
        const pending = await getPendingTotal(ledger);
        const available = Ledger.balanceOf(currentStudent, ledger.id) - pending;
        if (rewardData && available < rewardCost) {
          alert(s.notEnoughAlert(money(ledger, pending), money(ledger, available)));
          closeTeacherModal();
          renderRewards(ledger);
          return;
        }

        const requestData = {
          studentId: currentStudent.id,
          studentName: currentStudent.name,
          rewardId: currentRequest.rewardId,
          rewardName,
          cost: rewardCost,
          teacherId: target.id,
          teacherName: target.name,
          ledgerId: ledger.id,
          status: 'pending',
          requestedAt: firebase.firestore.FieldValue.serverTimestamp()
        };
        if (message) requestData.message = message;

        await db.collection('schools').doc(currentStudent.schoolId).collection('rewardRequests').add(requestData);
        closeTeacherModal();
        alert(s.sent(target.name || s.teacher));
      } catch (error) {
        console.error('sendRewardRequest error:', error.code, error.message, error);
        if (error.code === 'permission-denied') alert(s.noPerm);
        else if (error.code === 'auth/operation-not-allowed') alert(s.noAnon);
        else alert('❌ ' + s.sendErr + ': ' + (error.message || error.code || 'unknown'));
      }
    }

    /* ---------- Scorrimento tra le schede ---------- */
    function trackStep() { const t = document.getElementById('track'); return t.clientWidth + 12; }
    function slideIndex() { return Math.round(document.getElementById('track').scrollLeft / trackStep()); }
    function goTo(i) { document.getElementById('track').scrollTo({ left: i * trackStep(), behavior: 'smooth' }); }
    function syncDeck() {
      const i = Math.max(0, Math.min(slideIndex(), viewLedgers.length - 1));
      currentSlide = i;
      document.querySelectorAll('.subject-pill').forEach((p, k) => p.classList.toggle('active', k === i));
      document.querySelectorAll('.deck-dot').forEach((d, k) => d.classList.toggle('active', k === i));
      document.getElementById('prevBtn').disabled = i <= 0;
      document.getElementById('nextBtn').disabled = i >= viewLedgers.length - 1 || viewLedgers.length < 2;
    }
    document.getElementById('track').addEventListener('scroll', () => requestAnimationFrame(syncDeck));
    document.getElementById('prevBtn').onclick = () => goTo(slideIndex() - 1);
    document.getElementById('nextBtn').onclick = () => goTo(slideIndex() + 1);
    window.addEventListener('resize', syncDeck);

    // Expose handlers used by inline onclick attributes
    window.openQuickRewardsInfo = openQuickRewardsInfo;
    window.closeQuickRewardsInfo = closeQuickRewardsInfo;
    window.closeTeacherModal = closeTeacherModal;
    window.sendSelectedRequest = sendSelectedRequest;

    function showError(message) {
      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('mainContent').classList.add('hidden');
      document.getElementById('errorState').classList.remove('hidden');
      document.getElementById('errorMessage').textContent = message;
    }

    function showMotivation(ledger) {
      const quotes = MOTIVATION[ledger.lang === 'it' ? 'it' : 'en'];
      const el = document.getElementById('motivationQuote');
      el.textContent = quotes[Math.floor(Math.random() * quotes.length)];
      el.classList.remove('hidden');
    }

    function formatTime(timestamp, s) {
      if (!timestamp) return '';
      const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
      const diff = new Date() - date;
      const mins = Math.floor(diff / 60000), hours = Math.floor(diff / 3600000), days = Math.floor(diff / 86400000);
      if (mins < 1) return s.justNow;
      if (mins < 60) return s.mAgo(mins);
      if (hours < 24) return s.hAgo(hours);
      if (days < 7) return s.dAgo(days);
      return date.toLocaleDateString(s.locale);
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
