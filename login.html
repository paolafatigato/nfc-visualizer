<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SchoolBank - Login</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="icons/bank.png">
  <link rel="apple-touch-icon" href="icons/bank.png">
  
  <!-- CSS -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-page">
    <div class="login-container">
      <img class="login-logo" src="icons/bank.png" alt="Bank logo">
      <div class="login-card">
        <div class="login-header">
          <h1 class="login-title">💲CoolBank</h1>
          <p class="login-subtitle">School Bank</p>
        </div>
      
      <div class="login-body">
        <form id="loginForm" onsubmit="LoginPage.handleLogin(event)">
          <div class="input-group">
            <label class="input-label" for="loginEmail">Email</label>
            <input 
              type="email" 
              id="loginEmail" 
              class="input" 
              placeholder="name@school.com"
              autocomplete="email"
              required
            >
          </div>
          
          <div class="input-group">
            <label class="input-label" for="loginPassword">Password</label>
            <input 
              type="password" 
              id="loginPassword" 
              class="input" 
              placeholder="••••••••"
              autocomplete="current-password"
              required
            >
          </div>
          
          <button type="submit" class="btn btn-primary btn-lg w-full">
            🚀 Log in
          </button>
        </form>

        <div class="login-divider" role="separator" aria-label="or">
          <span>or</span>
        </div>

        <button type="button" id="googleLoginBtn" class="btn btn-secondary btn-lg w-full" onclick="LoginPage.handleGoogleLogin()">
          <svg width="18" height="18" viewBox="0 0 18 18" style="vertical-align:-3px;margin-right:8px;" aria-hidden="true">
            <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/>
            <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.9v2.33A9 9 0 0 0 9 18z"/>
            <path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.9A9 9 0 0 0 0 9c0 1.45.35 2.83.9 4.03l3.05-2.33z"/>
            <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .9 4.97l3.05 2.33C4.66 5.17 6.65 3.58 9 3.58z"/>
          </svg>
          Accedi con Google
        </button>

        <div class="text-center mt-6">
          <p class="text-muted" style="font-size: var(--text-sm);">
            If you cannot log in, check your Firebase credentials.
          </p>
        </div>
      </div>
    </div>
    </div>
  </div>
  
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-functions-compat.js"></script>
  
  <!-- App Scripts -->
  <script src="js/firebase-config.js"></script>
  <script src="js/script.js"></script>
  <script src="js/universaladmin.js"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      LoginPage.init();
    });
  </script>
</body>
</html>
