<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SchoolBank - Login</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="icons/bank.png">
  <link rel="apple-touch-icon" href="icons/bank.png">
  
  <!-- CSS -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-page">
    <div class="login-container">
      <img class="login-logo" src="icons/bank.png" alt="Bank logo">
      <div class="login-card">
        <div class="login-header">
          <h1 class="login-title">💲CoolBank</h1>
          <p class="login-subtitle">School Bank</p>
        </div>
      
      <div class="login-body">
        <form id="loginForm" onsubmit="LoginPage.handleLogin(event)">
          <div class="input-group">
            <label class="input-label" for="loginEmail">Email</label>
            <input 
              type="email" 
              id="loginEmail" 
              class="input" 
              placeholder="name@school.com"
              autocomplete="email"
              required
            >
          </div>
          
          <div class="input-group">
            <label class="input-label" for="loginPassword">Password</label>
            <input 
              type="password" 
              id="loginPassword" 
              class="input" 
              placeholder="••••••••"
              autocomplete="current-password"
              required
            >
          </div>
          
          <button type="submit" class="btn btn-primary btn-lg w-full">
            🚀 Log in
          </button>
        </form>
        
        <div class="text-center mt-6">
          <p class="text-muted" style="font-size: var(--text-sm);">
            If you cannot log in, check your Firebase credentials.
          </p>
        </div>
      </div>
    </div>
    </div>
  </div>
  
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-functions-compat.js"></script>
  
  <!-- App Scripts -->
  <script src="js/firebase-config.js"></script>
  <script src="js/script.js"></script>
  <script src="js/universaladmin.js"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      LoginPage.init();
    });
  </script>
</body>
</html>
